<!doctype html>
<html lang="es">

        --danger: #d77979;

      }

      }

        align-items: center;
        justify-content: center;
      }

        height: min(100vh, 62.5vw);
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 16/10;
        background: #080d13;
        cursor: crosshair;
        display: block;
        touch-action: none;
        outline: none;
      }

        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;

        justify-content: center;
        text-align: center;
        padding: 28px;

      }
      #rotate .rotate-card {
        max-width: 320px;
      }
      #rotate .rotate-mark {
        font-size: 48px;
        line-height: 1;
        color: #79c8c8;
        margin-bottom: 14px;
      }
      #rotate strong {
        display: block;
        font-size: 20px;
        letter-spacing: 0.14em;
      }
      #rotate span {
        display: block;
        margin-top: 12px;
        color: #91a0ae;
        font-size: 14px;
        line-height: 1.5;
      }
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
      @media (pointer: coarse) {
        canvas {
          cursor: default;
        }
      }
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
      canvas {
        width: min(100vw, 160dvh);
        height: min(100dvh, 62.5vw);
        max-width: 100vw;
        max-height: 100dvh;
      }
    </style>
  </head>

      C.addEventListener("pointermove", (e) => {

      addEventListener("keydown", (e) => {

        }
        if (k == "m") {

        else if ((k === " " || k === "shift") && st === "online" && net.gameState === "play") sendOnlineAction("dash");

          if (k == "d") st = "daily";
          if (k === "b") {
            almanacPage = 0;
            almanacSelected = "grunt";
            st = "almanac";
          }
          if (k == "o") openSettings("menu");
          if (k === "h") openSkills("menu");
          if (k === "l") {
            net.mode = "menu";
            st = "onlineLobby";
          }
        } else if (st === "skills") {
          if (k === "escape" || k === "backspace") {
            st = skillFrom;
            respecArmed = false;
          }
        } else if (st === "onlineLobby") {
          if (k === "escape") {
            if (net.mode === "join" && !net.p2pRoom) {
              net.mode = "menu";
              net.error = "";
            } else if (net.sessionActive) {
              st = "online";
            } else leaveOnline();
          } else if (k === "enter" && net.mode === "join") joinOnline();
        } else if (st === "online") {
          if ((k === "escape" || k === "p") && net.gameState === "play") sendOnlineAction("pause");
          else if ((k === "escape" || k === "p") && net.gameState === "pause") sendOnlineAction("resume");
          else if (net.gameState === "pick" && "123".includes(k)) sendOnlineAction("choose", +k - 1);
          else if (net.gameState === "dead" && (k === "enter" || k === "r")) sendOnlineAction("restart");
          else if (net.gameState === "dead" && k === "escape") leaveOnline();
        } else if (st === "almanac") {
          if (k === "escape") {
            st = "menu";
          } else if (k === "arrowright") {
            almanacPage = Math.min(Math.ceil(ENEMY_ALMANAC.length / 20) - 1, almanacPage + 1);
            almanacSelected = ENEMY_ALMANAC[almanacPage * 20]?.id || "grunt";
          } else if (k === "arrowleft") {
            almanacPage = Math.max(0, almanacPage - 1);
            almanacSelected = ENEMY_ALMANAC[almanacPage * 20]?.id || "grunt";
          }
        } else if (st == "daily") {
          if (k == "enter") start(true);
          if (k == "escape") st = "menu";
        } else if (st == "dead") {
          if (k == "enter") start(daily);
          if (k === "h") openSkills("dead");
          if (k == "escape") st = "menu";
        } else if (st == "settings") {

          } else if (k == "tab") {
            settingsPage = settingsPage == "basic" ? "advanced" : "basic";
            resetArmed = false;
          } else if (settingsPage == "basic" && "12345".includes(k)) togglePref(+k - 1);
          else if (settingsPage == "advanced" && "1234567".includes(k)) toggleAdvanced(+k - 1);
        } else if (st == "pick" && "123".includes(k)) pick(+k - 1);
        else if (st == "pick" && k == "r") rerollOffer();
        else if (st === "online" && (k === "p" || k === "escape")) {
          st = "onlineLobby";
          net.status = "En partida";
        } else if (st == "play" && (k == "p" || k == "escape")) st = "pause";
        else if (st == "pause" && (k == "p" || k == "escape")) st = "play";
      });
      addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = 0;
      });
      addEventListener("blur", () => {
        if (st == "play") st = "pause";
        touchMoveId = touchAimId = null;
        touchMoveOrigin = touchAimOrigin = null;
        touchMove = { x: 0, y: 0 };
      });
      requestAnimationFrame(loop);
      globalThis.__TETHER_SERVER__ = (() => {
        let runId = 0;
        function boot(ids) {
          const oldMute = mute;
          mute = 1;
          serverCoop = {
            enabled: true,
            players: (ids || []).map((q, i) => ({
              id: q.id,
              name: q.name || "PILOTO " + (i + 1),
              slot: i,
              input: { moveX: 0, moveY: 0, aimX: i ? -1 : 1, aimY: 0, aimLength: 0.8 },
              player: null,
              masses: [],
            })),
          };
          while (serverCoop.players.length < 2) {
            const i = serverCoop.players.length;
            serverCoop.players.push({
              id: "pilot-" + i,
              name: "PILOTO " + (i + 1),
              slot: i,
              input: { moveX: 0, moveY: 0, aimX: -1, aimY: 0, aimLength: 0.8 },
              player: null,
              masses: [],

          P.y = MH / 2;

          P.dead = false;
          P.aimX = 1;
          P.aimY = 0;
          P.aimLength = 0.8;
          cam.x = clamp(P.x - W / 2, 0, MW - W);
          cam.y = clamp(P.y - H / 2, 0, MH - H);
          for (const w of Wt) {

            w.y = P.y;
            w.vx = w.vy = 0;
            w.tr = [];

          const q = serverCoop.players[0];

          q.masses = Wt;
          q.build = S;
          q.adaptation = makePilotAdaptation();
          q.offer = [];
          q.choiceStatus = "idle";
          q.selectedUpgrade = "";

            p = {
              x: MW / 2 + 72,
              y: MH / 2,
              vx: 0,
              vy: 0,
              slow: 0,
              hp: P.mhp,
              mhp: P.mhp,
              spd: P.spd,
              dash: 0,
              dt: 0,
              impactT: 0,
              dcd: P.dcd,
              ult: 0,
              ultCd: 0,
              inv: 0.8,
              shield: S.shieldOn ? 1 : 0,
              kills: 0,

              lastStandUsed: false,

              aimY: 0,

          peer.choiceStatus = "idle";
          peer.selectedUpgrade = "";

            vy: 0,
            tr: [],

            P.aimLength = Number(a.aimLength) || 0.08;

              id: q.id,
              name: q.name,
              slot: i,
              build: q.build,
              offer: q.offer,

              y: p.y,
              vx: p.vx,
              vy: p.vy,

            state: st,
            runId,
            sounds: onlineSounds,
            players: ps,

            S,

              return q;

            bullets,
            parts,
            rings,
            room,
            score,
            runTime,
            xp,
            xpNext,
            level,
            combo,
            comboT,
            comboGrace,
            clearT,
            newBest,
            orbs,
            chests,
            chainArcs: chainArcs.map((a) => ({

              color: a.color,

              b: a.b ? { x: a.b.x, y: a.b.y } : null,

            fields,
            sectors,
            director,
            sh,
            pk,
            pkT,
            dscore,
            hpTrail,
            pops,
            slashes,
            flash,
            pulse,
            shk,
            hs,
            zm,
            uiNotice,
            uiNoticeQueue,
            activityHistory,
            activityScroll,
            comboBest,
            runRecords,
            best,
            seed,
            daily,
            groupSerial,
            runStats,
